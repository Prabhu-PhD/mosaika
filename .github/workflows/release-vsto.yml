name: Release Windows VSTO Installer & Office.js Manifest

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build MosaikaSetup.exe & Publish GitHub Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Inno Setup 6 (if not preinstalled)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Package Release VSTO DLL & MosaikaSetup.exe
        shell: pwsh
        run: pnpm package:vsto

      - name: Build production Office.js manifest for GitHub Pages URL
        shell: pwsh
        env:
          MOSAIKA_PUBLIC_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: pnpm build:site

      - name: Create GitHub Release with Installer + Office.js Manifest
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            hosts/windows-vsto/dist/MosaikaSetup-*.exe
            dist-site/office-js/manifest.xml
